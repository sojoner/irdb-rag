  # Updated to use Sojoner Database image while maintaining RAG naming/config
  db:
    image: docker.io/sojoner/database:latest
    build:
      context: .
    container_name: rag-db
    environment:
      RUN_ENV: production
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_chat
    ports:
      - "15432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./config:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network
    shm_size: 2g
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
  # Database initialization service
  db-init:
    image: docker.io/sojoner/database:latest
    container_name: rag-db-init
    environment:
      RUN_ENV: production
      PGPASSWORD: rag_password
      POSTGRES_USER: rag_user
      POSTGRES_DB: rag_chat
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql/init.sql:/init.sql:ro
      - ./config:/config:ro
    networks:
      - rag-network
    command: >
      bash -c "
        echo 'Running database initialization...';
        sed 's/$${EMBEDDING_DIMENSIONS}/'"$$EMBEDDING_DIMENSIONS"'/g' /init.sql | psql -h db -U $$POSTGRES_USER -d $$POSTGRES_DB;
        echo 'Database initialization complete!';
      "
    restart: "no"

  # Docling - Document Processing with AI Models
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: rag-docling
    ports:
      - "5001:5001"
    environment:
      RUN_ENV: production
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_MAX_SYNC_WAIT: "300"
      DOCLING_LOG_LEVEL: "INFO"
    volumes:
      - ./data/docling_models:/app/models
      - ./documents:/documents:ro
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

networks:
  rag-network:
    driver: bridge
