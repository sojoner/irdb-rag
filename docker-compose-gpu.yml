services:

  # Ollama - GPU LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - /data/ollama:/root/.ollama
    environment:
      # GPU configuration for RTX 3090
      OLLAMA_NUM_GPU: 1
    healthcheck:
      test: ollama list || exit 1
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 32G
        reservations:
          cpus: '2'
          memory: 24G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rag-network
    restart: unless-stopped

  # Ollama Model Download Init Service
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - /data/ollama:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Ollama is ready, downloading models..."

        # Download models for different tasks
        echo "Downloading granite4:tiny-h..."
        ollama pull granite4:tiny-h

        echo "Downloading qwen3-embedding:0.6b..."
        ollama pull qwen3-embedding:0.6b

        echo "All models downloaded successfully!"
    networks:
      - rag-network
    restart: "no"

  # Docling - GPU Document Processing with VLM
  docling:
    image: ghcr.io/docling-project/docling-serve-cu128:latest
    container_name: rag-docling
    ports:
      - "5001:5001"
    environment:
      # Core settings
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_MAX_SYNC_WAIT: "300"
      DOCLING_LOG_LEVEL: "INFO"

      # GPU acceleration
      DOCLING_DEVICE: "cuda:0"

      # Model artifacts path
      DOCLING_SERVE_ARTIFACTS_PATH: "/models"

      # Enable remote VLM services (use Ollama)
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"

      # VLM enrichment options
      DOCLING_SERVE_DO_PICTURE_DESCRIPTION: "true"
      DOCLING_SERVE_DO_PICTURE_CLASSIFICATION: "true"
      DOCLING_SERVE_DO_CODE_ENRICHMENT: "true"
      DOCLING_SERVE_DO_FORMULA_ENRICHMENT: "true"

      # Batch sizes optimized for RTX 3090
      DOCLING_OCR_BATCH_SIZE: "32"
      DOCLING_LAYOUT_BATCH_SIZE: "32"
      DOCLING_TABLE_BATCH_SIZE: "4"
    volumes:
      - /data/docling_models:/models
      - /data/docling_scratch:/scratch
      - ./documents:/documents:ro
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 24G
        reservations:
          cpus: '4'
          memory: 16G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rag-network
    restart: unless-stopped

  # Docling Model Pre-Download Init
  docling-init:
    image: ghcr.io/docling-project/docling-serve-cu128:latest
    container_name: docling-init
    volumes:
      - /data/docling_models:/models
    environment:
      DOCLING_SERVE_ARTIFACTS_PATH: "/models"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Download all required models
        docling-tools models download --all --output-dir=/models
        echo "Docling models downloaded successfully!"
    restart: "no"

  # PostgreSQL with pgvector
  db:
    image: sojoner/database:latest
    container_name: rag-db
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_chat
      # PostgreSQL tuning for 8GB RAM allocation
      POSTGRES_INITDB_ARGS: "-c shared_buffers=2GB -c effective_cache_size=6GB -c work_mem=128MB -c maintenance_work_mem=512MB"
    ports:
      - "15432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 2g
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - rag-network
    restart: unless-stopped

  # Database initialization service
  db-init:
    image: sojoner/database:latest
    container_name: rag-db-init
    environment:
      PGPASSWORD: rag_password
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql/init.sql:/init.sql:ro
    networks:
      - rag-network
    command: >
      bash -c "
        echo 'Running database initialization...';
        sed 's/\$${EMBEDDING_DIMENSIONS}/'"$$EMBEDDING_DIMENSIONS"'/g' /init.sql | psql -h db -U rag_user -d rag_chat;
        echo 'Database initialization complete!';
      "
    restart: "no"

  # Rust Development Container
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        CARGO_LEPTOS_VERSION: "0.3.2"
    container_name: rag-dev
    environment:
      RUN_ENV: test-gpu
      RUST_LOG: info
      LEPTOS_SITE_ROOT: /app/target/site
      LEPTOS_SITE_ADDR: 0.0.0.0:3000
      # Cargo caching
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /target
      # Parallel builds - adjust based on Mac resources
      CARGO_BUILD_JOBS: "8"
      # Rust compilation optimizations
      CARGO_INCREMENTAL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C codegen-units=16"
    ports:
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      # Remove GPU service dependencies for Mac development
      # docling:
      #   condition: service_healthy
      # ollama-init:
      #   condition: service_completed_successfully
    volumes:
      # Source code (bind mount for hot-reload)
      - .:/app:cached
      # Mac-compatible persistent caches (use Docker volumes instead of /data paths)
      - cargo_registry:/cargo/registry
      - cargo_git:/cargo/git
      - rust_target:/target
      - npm_cache:/app/node_modules
    working_dir: /app
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
    # Keep container running for interactive development
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  # Named volumes for Mac development (cross-platform compatible)
  cargo_registry:
  cargo_git:
  rust_target:
  npm_cache:
