<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat - Document Search & Chat</title>
    <link rel="stylesheet" href="/pkg/rag-chat.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232563eb' width='100' height='100'/><text x='50' y='60' font-size='70' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>R</text></svg>">
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import init, { hydrate } from '/pkg/rag_chat.js';

        async function main() {
            await init();
            hydrate();
        }

        main().catch(err => console.error('Failed to initialize app:', err));
    </script>
</body>
</html>
