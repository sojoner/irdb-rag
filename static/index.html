<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat - Document Search & Chat</title>
    <link rel="stylesheet" href="/pkg/rag-chat.css">
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import init, { hydrate } from '/pkg/rag_chat.js';

        async function main() {
            await init();
            hydrate();
        }

        main().catch(err => console.error('Failed to initialize app:', err));
    </script>
</body>
</html>
