[workspace]
members = ["."]

# Leptos configuration for cargo-leptos
[[workspace.metadata.leptos]]
name = "rag-chat"
output-name = "rag-chat"
bin-package = "rag-chat"
lib-package = "rag-chat"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "static"
bin-features = ["ssr"]
lib-features = ["hydrate"]

[package]
name = "rag-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework - Leptos 0.8
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }

# WASM-specific dependencies (client-side only)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "MouseEvent", "HtmlInputElement", "Request", "RequestInit", "Response", "Headers"], optional = true }
gloo-net = { version = "0.6", optional = true }

# Backend
axum = { version = "0.8", features = ["macros", "multipart"], optional = true }
tokio = { version = "1.42", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }

# Database - disable default features to reduce compile time
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }

# Document processing
lopdf = { version = "0.35", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
comrak = { version = "0.30", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
text-splitter = { version = "0.29", optional = true }
unicode-segmentation = "1.12"

# LLM API clients - reqwest needs different backends for SSR vs WASM
reqwest = { version = "0.12", default-features = false, features = ["json"] }
async-openai = { version = "0.28", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
notify = { version = "7", optional = true }
futures = "0.3"
async-stream = { version = "0.3", optional = true }
walkdir = { version = "2", optional = true }
html2text = { version = "0.12", optional = true }

# Config
config = { version = "0.14" }
toml = "0.8"
clap = { version = "4", features = ["derive"], optional = true }
wasm-streams = { version = "0.4.2", optional = true }
js-sys = { version = "0.3.83", optional = true }

[dev-dependencies]
tokio = { version = "1.42", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"] }

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos_axum",
    "tokio",
    "axum",
    "tower",
    "tower-http",
    "sqlx",
    "deadpool-postgres",
    "async-openai",
    "lopdf",
    "pulldown-cmark",
    "comrak",
    "image",
    "text-splitter",
    "tracing",
    "tracing-subscriber",
    "notify",
    "async-stream",
    "walkdir",
    "html2text",
    "clap",
    "reqwest/default-tls",
    "reqwest/stream",
]
hydrate = [
    "leptos/hydrate",
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "console_error_panic_hook",
    "web-sys",
    "gloo-net",
    "wasm-streams",
    "js-sys",
]

[lib]
name = "rag_chat"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rag-chat"
path = "src/main.rs"

# Default release profile - optimized for FAST compile times
[profile.release]
opt-level = 2  # Good optimization, much faster compile than opt-level 3
lto = false  # No LTO for maximum compile speed
codegen-units = 16  # More codegen units = faster compile, slightly larger binary

# Thin LTO profile - balanced optimization and compile time
# Use: cargo build --profile thin-lto
[profile.thin-lto]
inherits = "release"
lto = "thin"  # Thin LTO: balanced compile time and binary size
opt-level = 3
codegen-units = 1

# Production profile with full optimization - use for final production releases only
# Use: cargo build --profile production
[profile.production]
inherits = "release"
lto = true  # Full LTO: slowest compile, smallest binary, maximum optimization
opt-level = 3
codegen-units = 1  # Single codegen unit for maximum optimization

[profile.dev]
opt-level = 0
debug = 0
split-debuginfo = "unpacked"
incremental = true
