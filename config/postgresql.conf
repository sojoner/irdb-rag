# PostgreSQL Configuration for 90GB RAM System
# Optimized for RAG workload: fast restore + hybrid search + vector operations

# ============================================================================
# NETWORK - Docker Container Networking
# ============================================================================
listen_addresses = '*'                   # Listen on all interfaces for Docker networking

# ============================================================================
# MEMORY SETTINGS - 90GB System
# ============================================================================
shared_buffers = 20GB                    # 22% of RAM for buffer cache
effective_cache_size = 60GB              # 67% of RAM for planner
work_mem = 512MB                         # Per-operation memory (90GB / 16 workers / 12 ops)
maintenance_work_mem = 4GB               # For CREATE INDEX, VACUUM, etc.

# ============================================================================
# PARALLELIZATION - Use All 20 Cores
# ============================================================================
max_connections = 400
max_worker_processes = 20
max_parallel_workers = 16                # 80% of cores for parallel queries
max_parallel_workers_per_gather = 8      # Per-gather parallelism
max_parallel_maintenance_workers = 16    # For CREATE INDEX, VACUUM in parallel

# ============================================================================
# RESTORE OPTIMIZATION
# ============================================================================
# These are set dynamically during restore via ALTER DATABASE
# But defaults here ensure fast operations
wal_buffers = 256MB                      # Larger WAL buffer for bulk loads
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB

# ============================================================================
# QUERY PLANNING
# ============================================================================
random_page_cost = 1.1                   # SSD-friendly (lower = prefer index scans)
effective_io_concurrency = 200           # High for NVMe/SSD

# ============================================================================
# LOGGING (minimal for performance)
# ============================================================================
log_min_duration_statement = 5000        # Log queries > 5s
log_connections = off
log_disconnections = off

# ============================================================================
# PARADEDB SETTINGS (from original config)
# ============================================================================
paradedb.enable_aggregate_custom_scan = on
paradedb.enable_custom_scan_without_operator = on
paradedb.per_tuple_cost = 100
paradedb.limit_fetch_multiplier = 2
