# RAG Chat - Test Configuration
# Overrides default.toml for testing

[database]
url = "postgres://rag_user:rag_password@localhost:15432/rag_chat"

# All LLMs use same OpenRouter config for tests
[llm.chat]
provider = "LMStudio"
api_url = "http://127.0.0.1:1234/v1"
api_key = "lm-studio"
model = "ibm/granite-4-h-tiny"

[llm.metadata]
provider = "LMStudio"
api_url = "http://127.0.0.1:1234/v1"
api_key = "lm-studio"
model = "ibm/granite-4-h-tiny"

[llm.ner]
provider = "LMStudio"
api_url = "http://127.0.0.1:1234/v1"
api_key = "lm-studio"
model = "ibm/granite-4-h-tiny"

[llm]
timeout_seconds = 300

[embedding]
provider = "LMStudio"
api_url = "http://127.0.0.1:1234/v1"
api_key = "lm-studio"
model = "text-embedding-qwen3-embedding-0.6b"
dimensions = 1024
timeout_seconds = 120

[docling]
url = "http://localhost:5001"
timeout_seconds = 180
models = "DocLayNet,TableFormer,ibm-granite/granite-docling-258M-mlx-bf16"

[import]
workers = 2
max_retries = 3
retry_base_delay_ms = 1000
retry_max_delay_ms = 30000

[rag]
system_prompt = "You are a helpful AI assistant specialized in answering questions about documents. Use the provided document context to give accurate, well-sourced answers. If information is not available in the context, clearly state that. Always cite which documents you're referencing."
entity_extraction_enabled = true
